<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0F0D0A" />
    <meta name="description" content="Din personliga gymtracker" />

    <!-- PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gymbanan" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.json" id="app-manifest" />

    <!-- Synkront: använd admin-manifest om vi är på /admin-sidan.
         Detta körs INNAN React laddas så att Safari läser rätt manifest
         när användaren trycker 'Lägg till på hemskärmen'. -->
    <script>
      (function() {
        if (window.location.pathname.startsWith('/admin')) {
          var link = document.getElementById('app-manifest');
          if (link) link.setAttribute('href', '/manifest-admin.json');
          var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (appleTitle) appleTitle.setAttribute('content', 'Gym Admin');
          document.title = 'Gymbanan Admin';
        }
      })();
    </script>

    <!-- Startskarmen ligger i HTML:en sa den syns direkt vid start och aldrig
         monteras om nar React tar over. Bara transform/opacity animeras, sa
         den gar jamnt aven medan appens JavaScript laddas. -->
    <link rel="preload" href="/fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: 'GB Boot'; src: url('/fonts/barlow-condensed-latin-700-normal.woff2') format('woff2'); font-weight: 700; font-display: block; }
      #boot-splash { position: fixed; inset: 0; z-index: 10001; background: #0F0D0A; display: flex; align-items: center; justify-content: center; transition: opacity .28s ease-out; }
      #boot-splash.out { opacity: 0; pointer-events: none; }
      #boot-splash .bs { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      #boot-splash svg { width: 148px; height: auto; transform: scale(.94); animation: bsLogo .9s cubic-bezier(.2,.8,.2,1) forwards; will-change: transform; }
      /* Loggan ritas upp streck for streck. Gapet ar langre an strecket och
         startlaget ligger mitt i gapet, sa de runda andarna inte syns som
         prickar innan ritningen borjar. Appen renderas forst nar loggan ar
         klar (main.jsx), sa ritningen inte hackar medan React startar. */
      #boot-splash path { stroke-dasharray: 1 1.2; stroke-dashoffset: 1.1; animation: bsDraw .55s cubic-bezier(.55,0,.25,1) forwards; }
      #boot-splash path:nth-child(2) { animation-delay: .1s; }
      #boot-splash path:nth-child(3) { animation-delay: .2s; }
      #boot-splash .bs-t { font-family: 'GB Boot', 'Barlow Condensed', system-ui, sans-serif; font-size: 44px; line-height: 1; font-weight: 700; color: #F6F0E5; letter-spacing: .06em; opacity: 0; transform: translateY(8px); animation: bsRise .4s ease-out .4s forwards; will-change: transform, opacity; }
      #boot-splash .bs-bar { width: 148px; height: 3px; margin-top: 6px; background: #26231E; border-radius: 2px; overflow: hidden; opacity: 0; animation: bsFade .3s ease-out .6s forwards; }
      #boot-splash .bs-fill { width: 40%; height: 100%; background: #F5D020; border-radius: 2px; transform: translateX(-100%); animation: bsSweep 1.1s ease-in-out .6s infinite; will-change: transform; }
      @keyframes bsDraw { to { stroke-dashoffset: 0; } }
      @keyframes bsLogo { to { transform: none; } }
      @keyframes bsRise { to { opacity: 1; transform: none; } }
      @keyframes bsFade { to { opacity: 1; } }
      @keyframes bsSweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash svg, #boot-splash .bs-t, #boot-splash .bs-bar { animation: none; opacity: 1; transform: none; }
        #boot-splash path { animation: none; stroke-dasharray: none; stroke-dashoffset: 0; }
        #boot-splash .bs-fill { animation: none; transform: none; }
      }
    </style>

    <title>Gymbanan</title>
  </head>
  <body style="background:#0F0D0A;margin:0">
    <div id="boot-splash" aria-hidden="true">
      <div class="bs">
        <svg viewBox="0 0 368 448" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <g transform="matrix(0.636301,0,0,0.636301,-179.27,-188.032)" stroke-width="33.91">
            <path d="M525.743,833.601C566.369,915.815 693.476,991.271 724.91,954.91C761.681,912.377 680.659,849.072 634.187,743.13C600.613,666.589 592.627,632.492 608.18,630.444C648.867,625.086 703.359,695.016 723.545,703.71C765.184,721.642 726.672,572.647 637.694,553.745" stroke="#F5D020" pathLength="1" />
            <path d="M414.853,593.167C358.586,695.278 475.158,894.161 470.34,787.871C465.935,690.684 496.752,640.851 539.852,615.322" stroke="#F5D020" pathLength="1" />
            <path d="M450.065,526.833C480.4,361.306 652.342,282.173 688.014,326.87C715.159,360.882 648.301,387.739 608.609,449.278C578.899,495.34 574.54,535.463 581.649,566.785" stroke="#F6F0E5" pathLength="1" />
          </g>
        </svg>
        <span class="bs-t">GYMBANAN</span>
        <div class="bs-bar"><div class="bs-fill"></div></div>
      </div>
    </div>
    <script>
      // React anropar __hideBootSplash nar startsidan har sin data (eller
      // direkt vid inloggning/admin). Skyddsnat: bort efter 12 s oavsett.
      (function () {
        var el = document.getElementById('boot-splash')
        window.__hideBootSplash = function () {
          if (!el || el.dataset.out) return
          el.dataset.out = '1'
          el.classList.add('out')
          setTimeout(function () { el.remove() }, 320)
        }
        if (location.pathname.indexOf('/admin') === 0) { el.remove(); el = null }
        setTimeout(window.__hideBootSplash, 12000)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
